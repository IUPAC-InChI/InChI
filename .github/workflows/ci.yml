name: InChI Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  test_glibc_gcc:
    runs-on: ubuntu-24.04
    container: python:3.12

    steps:
      - uses: actions/checkout@v6

      - id: setup
        run: ./.devcontainer/post_create_commands.sh

      - name: Run unit tests
        run: cd CMake_build/full_build/INCHI-1-TEST/tests/test_unit && ctest --output-on-failure

      - name: Run executable tests
        run: pytest INCHI-1-TEST/tests/test_executable

      - name: Run multithreading test
        run: python INCHI-1-TEST/tests/test_library/test_multithreading.py
        timeout-minutes: 1

      - uses: ./.github/actions/regression_tests
        with:
          artifact-name: regression-test-results_glibc_gcc

      - uses: ./.github/actions/invariance_tests
        with:
          artifact-name: invariance-test-results_glibc_gcc


  test_musl_gcc:
    runs-on: ubuntu-24.04
    # FIXME: Unpin the alpine version. It's pinned to keep the Python version from advancing beyond 3.12.
    # The latter is necessary due to https://github.com/IUPAC-InChI/InChI/issues/35.
    container: alpine:3.23

    steps:
      - name: Install build and test environment
        run: |
          apk add bash git musl-dev gcc g++ make python3 py-pip cmake

      # We need to install git before checking out the repository.
      # Otherwise, the repository will be downloaded using the GitHub REST API instead of git.
      - uses: actions/checkout@v6

      - name: Show Python version
        run: |
          python --version

      - name: Configure pip to break system packages
        run: |
          mkdir -p ~/.config/pip
          cat <<EOT >> ~/.config/pip/pip.conf
          [global]
          break-system-packages = true
          EOT

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e INCHI-1-TEST

      - id: build
        run: ./INCHI-1-TEST/build_with_cmake.sh all

      - name: Run unit tests
        run: cd CMake_build/full_build/INCHI-1-TEST/tests/test_unit && ctest --output-on-failure

      - name: Run executable tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pytest INCHI-1-TEST/tests/test_executable

      - name: Run multithreading test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python INCHI-1-TEST/tests/test_library/test_multithreading.py
        timeout-minutes: 1

      - uses: ./.github/actions/regression_tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          artifact-name: regression-test-results_musl_gcc

      # FIXME: We don't run invariance test on alpine yet because of difficulties with RDKit installation.


  lint:
    name: Code Quality
    permissions:
      # give only read-only access to the contents of the repository
      # this is the only permission this job requires, so keep it to the least privilege
      # i.e., not to issues, discussions, actions, etc.
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      # See documentation on ruff CI integration at
      # https://docs.astral.sh/ruff/integrations/#github-actions
      - name: Run Ruff format check
        run: ruff format --check --output-format=github .

      # Update output format to enable automatic inline annotations.
      - name: Run Ruff check
        run: ruff check --output-format=github .
