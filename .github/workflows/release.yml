name: Release

on:
  workflow_dispatch:

jobs:
  define_matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.define_matrix.outputs.matrix }}
      release_tag: ${{ steps.define_version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify build matrix
        # The build matrix is used to interpolate commands and inputs throughout the remainder of the workflow.
        # Since those interpolations are potentially security-sensitive, we verify the hash of the build matrix.
        if: ${{ hashFiles('.github/workflows/build_matrix.json') != 'f2f0d2d642baf81c8899dcb548d9f306eeb7b42ec98c320d2351762e63a3da99' }}
        run: |
          echo "CI run aborted due to unexpected changes to the build matrix."
          exit 1

      - name: Define build matrix
        id: define_matrix
        run: |
          echo "matrix=$(cat .github/workflows/build_matrix.json| jq -c .)" >> $GITHUB_OUTPUT

      - name: Define release tag
        id: define_version
        run: |
          cmake -S INCHI-1-SRC/INCHI_EXE/inchi-1/src -B CMake_build/version_check
          version=$(sed -n 's/^#define INCHI_SOFTWARE_VERSION "\(.*\)"$/\1/p' CMake_build/version_check/generated/inchi_version.h)
          if [[ -z "$version" ]]; then
            echo "Unable to read INCHI_SOFTWARE_VERSION from the generated header."
            exit 1
          fi
          echo "release_tag=v${version}" >> "$GITHUB_OUTPUT"

  build_and_test:
    needs: define_matrix
    strategy:
      matrix:
        include:
          ${{ fromJson(needs.define_matrix.outputs.matrix) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Define release directory
        id: release_dir
        shell: bash
        env:
          SLUG: ${{ matrix.slug }}
          SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.define_matrix.outputs.release_tag }}
        run: |
          tag_part="-${RELEASE_TAG//[^A-Za-z0-9._-]/_}"
          echo "value=inchi-${SLUG}${tag_part}-${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: ${{ matrix.pre_build }}

      - name: Set up Visual Studio shell
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@9a932a62d05192eae18ca370155cf877eecc2202
        with:
          arch: x64

      - name: Build executable
        run: |
          cmake -B CMake_build/cli_build -S INCHI-1-SRC/INCHI_EXE/inchi-1/src
          ${{ matrix.build_exe }}

      - name: Test executable
        run: pytest INCHI-1-TEST/tests/test_executable --exe-path ${{ matrix.exe_path }}

      - name: Build library
        run: |
          cmake -B CMake_build/libinchi_build -S INCHI-1-SRC/INCHI_API/demos/inchi_main/src
          ${{ matrix.build_lib }}

      - name: Test library
        uses: ./.github/actions/regression_tests
        with:
          artifact-name: regression-test-results-${{ matrix.slug }}-${{ github.sha }}
          library-path: ${{ matrix.lib_path }}
          shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}

      - name: Upload CMake configurations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CMake-configurations-${{ matrix.slug }}-${{ github.sha }}
          path: |
            CMake_build/libinchi_build/CMakeCache.txt
            CMake_build/cli_build/CMakeCache.txt

      - name: Collect artifacts
        run: |
          mkdir -p ${{ steps.release_dir.outputs.value }}
          cp ${{ matrix.exe_path }} ${{ steps.release_dir.outputs.value }}
          cp ${{ matrix.lib_path }} ${{ steps.release_dir.outputs.value }}
          cp ${{ matrix.main_path }} ${{ steps.release_dir.outputs.value }}

      - id: upload-unsigned-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_dir.outputs.value }}
          path: ${{ steps.release_dir.outputs.value }}

      - name: Sign artifacts
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 656f8204-f8c5-4028-bd48-f832f5f89b31
          project-slug: InChI
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned-artifacts.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ steps.release_dir.outputs.value }}-signed

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: ${{ steps.release_dir.outputs.value }}-signed
          path: ${{ steps.release_dir.outputs.value }}-signed

  release:
    needs: [define_matrix, build_and_test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # The complete history is retained so the release is created from the checked-out commit.
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.1.0
        with:
          path: release_artifacts
          pattern: inchi-*

      - name: Package artifacts
        run: zip -r release_artifacts.zip release_artifacts

      - name: Download CMake configurations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.1.0
        with:
          path: cmake_configurations
          pattern: CMake-configurations-*

      - name: Package CMake configurations
        run: zip -r cmake_configurations.zip cmake_configurations

      - name: Create release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.define_matrix.outputs.release_tag }}
        run: |
          if existing_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha' 2>/dev/null); then
            echo "Release tag $TAG already exists at $existing_commit. Aborting."
            exit 1
          fi

          # See https://cli.github.com/manual/gh_release_create.
          gh release create "$TAG" \
          --target "$GITHUB_SHA" \
          --title "$TAG" \
          --notes "For details about this release have a look at the [CHANGELOG](INCHI-1-DOC/CHANGELOG.md)." \
          release_artifacts.zip cmake_configurations.zip
